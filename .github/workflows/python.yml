name: Python tests

on:
  push:
    branches: [main]
    paths: ['python/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['python/**', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests (preprocessing and augmentation)
        run: pytest -q test_utils.py
      - name: Smoke test (train 2 epochs, drive over Socket.IO)
        run: python test_smoke.py
